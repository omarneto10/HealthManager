<title>Saúde Integrada — acompanhamento longitudinal</title><style>:root{
  --page:#f4f6f5;--surface:#fcfcfb;--surface-2:#f0f2f1;--ink:#0b0b0b;--ink-2:#52514e;--muted:#898781;--line:#e1e0d9;--base:#c3c2b7;
  --brand:#0f6e6a;--brand-2:#e3f1ef;--accent:#2a78d6;
  --good:#0ca30c;--good-ink:#006300;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;
  --radius:10px;--shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;color:var(--ink);
}
@media (prefers-color-scheme:dark){:root{--page:#0d0d0d;--surface:#1a1a19;--surface-2:#232322;--ink:#f0efec;--ink-2:#c3c2b7;--muted:#898781;--line:#2c2c2a;--base:#383835;--brand:#3fb8af;--brand-2:#13302e;--good-ink:#0ca30c}}
*{box-sizing:border-box}body{margin:0;background:var(--page)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;font-weight:700;letter-spacing:-.01em}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:#fff;font-size:16px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.nav a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;margin-bottom:2px}
.nav a:hover{background:var(--surface-2)}.nav a.on{background:var(--brand-2);color:var(--brand);font-weight:600}
.nav .ico{width:18px;text-align:center}
.main{min-width:0}
.top{display:flex;gap:12px;align-items:center;padding:10px 22px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top h1{font-size:17px;margin:0;flex:1;min-width:160px}
.status{font-size:12px;color:var(--muted)}
.content{padding:20px 22px 60px;max-width:1280px}
.btn.menu-btn{display:none}
@media (max-width:860px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:20;left:-260px;width:250px;transition:left .2s;box-shadow:var(--shadow)}.side.open{left:0}.btn.menu-btn{display:inline-flex}.content{padding:14px 12px 60px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3{font-size:13px;margin:14px 0 8px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);cursor:pointer}
.kpi .l{font-size:12px;color:var(--ink-2)}.kpi .v{font-size:24px;font-weight:650;letter-spacing:-.02em;margin:2px 0}.kpi .v small{font-size:13px;font-weight:400;color:var(--ink-2)}
.kpi .s{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;align-items:end;gap:6px}
.delta-good{color:var(--good-ink);font-weight:600}.delta-bad{color:var(--crit);font-weight:600}.delta-neu{color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{background:var(--surface-2)}.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12px}.btn.ghost{border-color:transparent;background:transparent}.btn.danger{color:var(--crit)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;border-right:1px solid var(--line);font-size:12px}.seg button:last-child{border-right:0}.seg button.on{background:var(--brand-2);color:var(--brand);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}.tabs button.on{color:var(--brand);border-color:var(--brand);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--ink-2);font-size:12px;background:var(--surface-2);position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow:auto;max-height:620px;border:1px solid var(--line);border-radius:8px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
.flag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px}
.flag.H,.flag.L{background:#fdeceb;color:#a32b2b}.flag.N{background:#e7f5e7;color:#006300}
@media (prefers-color-scheme:dark){.flag.H,.flag.L{background:#3a1b1b;color:#f19a9a}.flag.N{background:#173117;color:#7fd27f}}
.chip{display:inline-flex;gap:4px;align-items:center;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--ink-2);background:var(--surface-2);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:2px 7px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.tag.obj{background:#e8f1fc;color:#1c5cab;border-color:#cde2fb}.tag.hip{background:#fff5e0;color:#8a5a00;border-color:#fbe3b0}.tag.rec{background:#e3f1ef;color:#0f6e6a;border-color:#bfe0dc}
@media (prefers-color-scheme:dark){.tag.obj{background:#14263d;color:#86b6ef;border-color:#1c3a5c}.tag.hip{background:#3a2c0f;color:#f5c66b;border-color:#5a4415}.tag.rec{background:#13302e;color:#6fd0c8;border-color:#1e4a46}}
.alert{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:8px;margin-bottom:8px;background:var(--surface)}
.alert.critico{border-left-color:var(--crit)}.alert.atencao{border-left-color:var(--serious)}.alert.info{border-left-color:var(--accent)}
.alert .ic{font-size:15px;line-height:1.3}.alert .t{font-weight:600}.alert .d{color:var(--ink-2);font-size:12px;margin-top:2px}
.prio{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--surface)}
.prio summary{cursor:pointer;font-weight:600;list-style:none;display:flex;gap:8px;align-items:flex-start}.prio summary::-webkit-details-marker{display:none}
.prio dl{display:grid;grid-template-columns:170px 1fr;gap:6px 12px;margin:10px 0 0;font-size:13px}.prio dt{color:var(--ink-2)}.prio dd{margin:0}
@media (max-width:600px){.prio dl{grid-template-columns:1fr}}
.pbadge{flex:none;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;color:#fff}.p1{background:var(--crit)}.p2{background:#c4622f}.p3{background:var(--brand)}
.muted{color:var(--muted)}.small{font-size:12px}.right{text-align:right}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
.form .full{grid-column:1/-1}
input,select,textarea{border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:var(--surface);min-width:0}
textarea{min-height:64px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-2);border-color:var(--brand)}
.chart{min-height:200px}.chart svg{display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}.chart .baseline{stroke:var(--base)}.chart .axis{fill:var(--muted);font-size:11px}
.chart .band{fill:#1baf7a;opacity:.09}.chart .marker{stroke:var(--ink-2);stroke-dasharray:3 3;stroke-width:1}.chart .marker-label{fill:var(--ink-2);font-size:10px}
.chart .dlabel{fill:var(--ink);font-size:11px;font-weight:600}.chart .xhair{stroke:var(--ink-2);stroke-width:1}
.tip{position:absolute;z-index:3;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:8px 10px;font-size:12px;pointer-events:none;min-width:180px;max-width:300px}
.tip-d{font-weight:600;margin-bottom:4px}.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.hbar{display:grid;grid-template-columns:120px 1fr 80px;gap:8px;align-items:center;font-size:12px;margin:5px 0}.hbar-t{height:10px;background:var(--surface-2);border-radius:4px;overflow:hidden}.hbar-t span{display:block;height:100%;border-radius:4px}.hbar-v{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:30px;text-align:center;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:12px;max-width:880px;width:100%;max-height:90vh;overflow:auto;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal h2{margin-top:0;font-size:17px}
.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;z-index:60;font-size:13px}
.notice{border:1px solid #fbe3b0;background:#fff8e8;color:#6b4a00;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px}
@media (prefers-color-scheme:dark){.notice{background:#2c220c;border-color:#5a4415;color:#f5d48b}}
.disclaimer{font-size:12px;color:var(--ink-2);border-left:3px solid var(--brand);padding:6px 10px;background:var(--brand-2);border-radius:0 6px 6px 0;margin-bottom:14px}
.meal{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.meal-h{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--surface-2);flex-wrap:wrap}.meal-h b{font-size:14px}
.meal table td,.meal table th{border-bottom:1px solid var(--line)}
.macro{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}.macro b{color:var(--ink)}
.timeline{position:relative;padding-left:22px}.timeline:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl{position:relative;margin-bottom:12px}.tl:before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--brand)}
.tl .dt{font-size:12px;color:var(--muted)}.tl.int:before{border-color:#eb6834;background:#eb6834}
.lock{max-width:440px;margin:10vh auto;padding:28px}.lock h1{font-size:20px}
.diff-pos{color:var(--good-ink)}.diff-neg{color:var(--crit)}
.week{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:8px;overflow-x:auto}.day{border:1px solid var(--line);border-radius:8px;padding:8px;min-height:90px;font-size:12px}.day b{display:block;margin-bottom:6px}.day .it{background:var(--brand-2);color:var(--brand);border-radius:6px;padding:4px 6px;margin-bottom:4px}
@media print{.side,.top,.noprint{display:none!important}.app{display:block}.card{box-shadow:none;break-inside:avoid}.content{max-width:none;padding:0}body{background:#fff}}

.chipsel{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;background:var(--surface);color:var(--ink)}
.chipsel:has(input:checked){background:var(--brand-2);border-color:var(--brand);color:var(--brand);font-weight:600}
.chipsel input{margin:0}
details.more{margin-top:6px}details.more>summary{cursor:pointer;color:var(--brand);font-size:12px;font-weight:600}details.more[open]>summary{margin-bottom:6px}
.fb{margin-top:6px;padding:6px 10px;border-left:3px solid var(--brand);background:var(--surface-2);border-radius:0 6px 6px 0}
.food-list{list-style:none;margin:0;padding:10px 14px}.food-list li{padding:5px 0;border-bottom:1px dashed var(--line)}.food-list li:last-child{border:0}

.ex-chip{cursor:pointer}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.gal img{width:100%;border-radius:6px;cursor:zoom-in;background:#000}
.form label.chipsel{flex-direction:row;color:var(--ink)}
.explain-box{background:var(--brand-2);border-radius:8px;padding:10px 14px;margin-bottom:10px}.explain-box p{margin:4px 0}
.kpi[data-explain]:hover{border-color:var(--brand)}
.alts{margin:0 14px 10px;padding:8px 10px;border:1px dashed var(--brand);border-radius:8px}
.pend-row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}.pend-row.done{color:var(--muted);text-decoration:line-through}.pend-row .btn{white-space:nowrap}
tr.clickable{cursor:pointer}tr.clickable:hover td{background:var(--surface-2)}
.dash-list{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto}
.dash-item{display:flex;align-items:center;gap:4px;padding:4px 8px;border:1px solid var(--line,#e3e6e8);border-radius:8px;background:var(--surface,#fff)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-h{font-size:12px;color:var(--muted,#667);text-align:center;padding:2px}
.cal-c{min-height:68px;border:1px solid var(--line,#e3e6e8);border-radius:6px;padding:3px;cursor:pointer;overflow:hidden;background:var(--surface,#fff)}
.cal-c:hover{border-color:var(--accent,#0f6e5f)}.cal-c.empty{border:none;background:none;cursor:default}.cal-c.past{opacity:.7}
.cal-c.today{outline:2px solid var(--accent,#0f6e5f)}.cal-n{font-size:12px;font-weight:600}
.cal-e{font-size:11px;line-height:1.25;background:#e6f2ef;border-radius:4px;padding:1px 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-e.realizado{background:#eceff1;color:#555}
.appt{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line,#e3e6e8)}
.appt-d{width:92px;font-size:13px}.appt-a{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:210px}
.appt.cancelado{opacity:.55}.btn.warn{border-color:#d9a400;color:#7a5a00;background:#fff8e1}
.tl-row{display:flex;gap:8px;align-items:flex-start}.tl-act{display:flex;gap:4px;flex-shrink:0}
.tl-origin{color:var(--muted,#667);margin-top:2px}
</style></head>

  /* Interpreta texto de referência: "a-b", "<x", "<=x", ">x", ">=x". Outros → só texto. */
  function parseRef(ref) {
    if (!ref || typeof ref !== 'string') return null;
    const s = ref.replace(/,/g, '.').trim();
    let m = s.match(/^(-?\d+(?:\.\d+)?)\s*-\s*(-?\d+(?:\.\d+)?)$/);
    if (m) return { lo: +m[1], hi: +m[2], loInc: true, hiInc: true };
    m = s.match(/^(<=|<|>=|>)\s*(-?\d+(?:\.\d+)?)$/);
    if (m) {
      const v = +m[2];
      if (m[1] === '<') return { hi: v, hiInc: false };
      if (m[1] === '<=') return { hi: v, hiInc: true };
      if (m[1] === '>') return { lo: v, loInc: false };
      if (m[1] === '>=') return { lo: v, loInc: true };
    }
    return null;
  }
  /* Retorna 'L' (baixo), 'H' (alto), 'N' ou null (sem faixa interpretável) */
  function flag(value, ref) {
    if (value === null || value === undefined || isNaN(value)) return null;
    const r = parseRef(ref);
    if (!r) return null;
    if (r.lo !== undefined && (r.loInc ? value < r.lo : value <= r.lo)) return 'L';
    if (r.hi !== undefined && (r.hiInc ? value > r.hi : value >= r.hi)) return 'H';
    return 'N';
  }
  function refLabel(ref) {
    const r = parseRef(ref);
    if (!r) return ref || '—';
    if (r.lo !== undefined && r.hi !== undefined) return `${fmtNum(r.lo)} – ${fmtNum(r.hi)}`;
    if (r.hi !== undefined) return (r.hiInc ? '≤ ' : '< ') + fmtNum(r.hi);
    return (r.loInc ? '≥ ' : '> ') + fmtNum(r.lo);
  }
  function fmtNum(v, d) {
    if (v === null || v === undefined || v === '') return '—';
    if (typeof v !== 'number') return String(v);
    const dec = d !== undefined ? d : (Math.abs(v) >= 1000 ? 0 : Math.abs(v) >= 10 ? 1 : 3);
    return v.toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: dec });
  }
  function info(code) { return C[code] || { code, name: code, unit: '', cat: 'Outros' }; }

  window.Catalog = { analytes: C, METHODS, parseRef, flag, refLabel, fmtNum, info };

  function context(code, pid) {
    const P = Store.get('patients', pid) || {}; const C = P.clinical || {}; const out = [];
    const dx = re => (C.diagnoses || []).some(d => d.status !== 'descartado' && re.test(d.text)) || [].concat(C.metabolic || []).some(x => re.test(x));
    const med = re => Store.list('medications', m => m.patientId === pid && !m.end && re.test(m.name)).length > 0;
    if (code === 'acido_urico' && dx(/gota/i)) out.push('Você trata gota: a meta usual é ácido úrico abaixo de 6 mg/dL, mesmo que a referência do laboratório vá até 7,8.');
    if (code === 'acido_urico' && med(/alopurinol/i)) out.push('O alopurinol reduz a produção de ácido úrico; o efeito aparece nos exames após algumas semanas.');
    if (['creatinina', 'tfg'].includes(code) && med(/creatina/i)) out.push('Você usa creatina, que pode elevar um pouco a creatinina sem que os rins estejam piores.');
    if (['massa_magra', 'massa_livre_gordura', 'massa_muscular_esq', 'peso'].includes(code) && med(/semaglut/i)) out.push('A semaglutida reduz o apetite e o peso; parte do peso perdido pode ser massa magra, por isso proteína e treino de força são importantes.');
    if (code === 'vitd' && med(/vitamina d/i)) out.push('Você usa vitamina D; sem a data de início, não dá para saber se o último exame já reflete o suplemento.');
    if (code === 'b12' && med(/b12/i)) out.push('Você usa vitamina B12, o que tende a manter esse exame normal ou alto.');
    if (code === 'pcr_us' && dx(/gota/i)) out.push('Crises de gota elevam a PCR; o valor só serve para risco cardiovascular se colhido fora de crise.');
    if (['tgp', 'tgo', 'ggt', 'fib4'].includes(code)) out.push('O ultrassom de 03/2026 mostrou gordura leve no fígado.');
    if (['hemacias', 'vcm', 'hcm', 'mentzer', 'sat_transf', 'ferro', 'ferritina', 'rdw'].includes(code)) out.push('Esses exames são avaliados em conjunto: veja "Glóbulos vermelhos pequenos…" em Avaliação clínica → Próximos passos.');
    return out;
  }
  window.Explain = { E, context, get: code => E[code] || null };
})();

/* ===== core/store.js ===== */
/* =====================================================================
   STORE — persistência local (IndexedDB), criptografia opcional por senha
   (AES-GCM + PBKDF2 via WebCrypto), histórico de versões e auditoria.
   Uso pessoal: um único usuário, sem perfis corporativos.
   Nenhum registro é sobrescrito sem guardar a versão anterior.
   ===================================================================== */
(function () {
  const DB_NAME = 'plataforma_saude_v1';
  const ENTITIES = ['appointments', 'alertDismiss', 'professionals', 'stepFeedback', 'patients', 'documents', 'observations', 'studies', 'medications', 'goals', 'mealPlans', 'foodLogs',
    'trainingPlans', 'activityLogs', 'interventions', 'notes', 'encounters', 'consents', 'inconsistencies', 'pending', 'energy', 'segmental'];

  let idb = null, data = null, key = null, mode = 'memoria', saveTimer = null, listeners = [];
  const enc = new TextEncoder(), dec = new TextDecoder();
  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const uid = p => (p || 'id') + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const now = () => new Date().toISOString();
  const clone = o => JSON.parse(JSON.stringify(o));

  // ---------- IndexedDB ----------
  function openIDB() {
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open(DB_NAME, 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('files'); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
  }
  function idbOp(store, op, k, v) {
    return new Promise((res, rej) => {
      const tx = idb.transaction(store, op === 'get' || op === 'getAllKeys' ? 'readonly' : 'readwrite');
      const s = tx.objectStore(store);
      const r = op === 'get' ? s.get(k) : op === 'put' ? s.put(v, k) : op === 'delete' ? s.delete(k) : s.getAllKeys();
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  }

  // ---------- Criptografia ----------
  const cryptoOK = () => !!(window.crypto && crypto.subtle);
  async function deriveKey(password, salt) {
    const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function encryptBytes(bytes) {
    if (!key) return { plain: true, data: bytes };
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, bytes);
    return { iv: b64(iv), data: ct };
  }
  async function decryptBytes(rec) {
    if (rec.plain) return rec.data;
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(rec.iv) }, key, rec.data);
  }

  // ---------- Ciclo de vida ----------
  async function init() {
    try { idb = await openIDB(); mode = 'indexeddb'; } catch (e) { idb = null; mode = 'memoria'; }
    if (!idb) return { state: 'memoria' };
    const meta = await idbOp('kv', 'get', 'meta');
    if (!meta) return { state: 'novo' };
    if (meta.locked) return { state: 'bloqueado', meta };
    await loadPayload(); return { state: 'pronto' };
  }
  async function loadPayload() {
    const rec = await idbOp('kv', 'get', 'payload');
    const bytes = await decryptBytes(rec);
    data = JSON.parse(dec.decode(bytes));
    migrate();
  }
  async function unlock(password) {
    const meta = await idbOp('kv', 'get', 'meta');
    key = await deriveKey(password, unb64(meta.salt));
    try { await loadPayload(); return true; } catch (e) { key = null; return false; }
  }
  async function createNew(password) {
    data = buildFromSeed(); migrate();
    if (password && cryptoOK()) await setPassword(password, true); else if (idb) await idbOp('kv', 'put', 'meta', { locked: false, createdAt: now() });
    log('sistema', null, 'criacao', null, { info: 'Base criada a partir dos documentos do projeto' });
    await persist();
  }
  /* aparelho novo: cria a base local a partir de um backup (arquivo ou Google Drive) */
  async function createFromBackup(text, password) {
    const o = JSON.parse(text); if (o.format !== 'plataforma-saude') throw new Error('Arquivo não reconhecido');
    data = o.data; migrate();
    if (password && cryptoOK()) await setPassword(password, true); else if (idb) await idbOp('kv', 'put', 'meta', { locked: false, createdAt: now() });
    log('sistema', null, 'criacao_por_backup', null, { exportedAt: o.exportedAt }); await persist();
  }
  function startMemory() { data = buildFromSeed(); mode = 'memoria'; migrate(); }

  async function setPassword(password, silent) {
    if (!cryptoOK()) throw new Error('WebCrypto indisponível neste navegador/contexto');
    // decifra arquivos com a chave atual antes de trocá-la
    const keys = idb ? await idbOp('files', 'getAllKeys') : [];
    const plainFiles = [];
    for (const k of keys) { const r = await idbOp('files', 'get', k); plainFiles.push({ k, name: r.name, type: r.type, size: r.size, buf: await decryptBytes(r) }); }
    const salt = crypto.getRandomValues(new Uint8Array(16));
    key = password ? await deriveKey(password, salt) : null;
    await idbOp('kv', 'put', 'meta', { locked: !!password, salt: b64(salt), updatedAt: now() });
    for (const f of plainFiles) { const rec = await encryptBytes(f.buf); rec.name = f.name; rec.type = f.type; rec.size = f.size; await idbOp('files', 'put', f.k, rec); }
    if (!silent) log('sistema', null, password ? 'senha_definida' : 'senha_removida', null, {});
    await persist();
  }

  function persistSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(persist, 300); }
  async function persist() {
    if (!idb || !data) return;
    const rec = await encryptBytes(enc.encode(JSON.stringify(data)));
    await idbOp('kv', 'put', 'payload', rec);
    listeners.forEach(f => { try { f('saved'); } catch (e) { } });
  }

  function migrate() {
    ENTITIES.forEach(e => { if (!data[e]) data[e] = []; }); if (!data.audit) data.audit = []; if (!data.settings) data.settings = {}; if (!data.meta) data.meta = {};
    const done = data.meta.patches || (data.meta.patches = []);
    ((window.SEED && window.SEED.patches) || []).forEach(p => { if (done.includes(p.id)) return; try { p.apply(window.Store); done.push(p.id); } catch (e) { console.error('patch', p.id, e); } });
  }

  // ---------- Auditoria e versionamento ----------
  function log(entity, id, op, before, after, reason) {
    data.audit.push({ ts: now(), entity, id, op, before: before ? clone(before) : null, after: after ? clone(after) : null, reason: reason || '' });
  }
  function list(entity, fn) { return (data[entity] || []).filter(r => r.status !== 'arquivado' && (!fn || fn(r))); }
  function listAll(entity, fn) { return (data[entity] || []).filter(r => !fn || fn(r)); }
  function get(entity, id) { return (data[entity] || []).find(r => r.id === id); }
  function insert(entity, rec, reason) {
    const r = Object.assign({ id: uid(entity.slice(0, 3)), createdAt: now(), updatedAt: now(), version: 1, status: 'ativo' }, rec);
    data[entity].push(r); log(entity, r.id, 'inclusao', null, r, reason); persistSoon(); return r;
  }
  function update(entity, id, patch, reason) {
    const r = get(entity, id); if (!r) throw new Error('Registro não encontrado');
    const before = clone(r);
    Object.assign(r, patch, { updatedAt: now(), version: (r.version || 1) + 1 });
    log(entity, id, 'alteracao', before, r, reason); persistSoon(); return r;
  }
  function archive(entity, id, reason) { return update(entity, id, { status: 'arquivado' }, reason || 'Arquivado (sem exclusão física)'); }
  function history(entity, id) { return data.audit.filter(a => a.entity === entity && a.id === id); }
  function restoreVersion(entity, id, auditIndex) {
    const a = data.audit[auditIndex]; if (!a || !a.before) return;
    const patch = clone(a.before); delete patch.version; return update(entity, id, patch, 'Restauração de versão anterior (' + a.ts + ')');
  }
  function settings(patch) { if (patch) { Object.assign(data.settings, patch); persistSoon(); } return data.settings; }

  // ---------- Arquivos originais ----------
  async function putFile(docId, file) {
    const buf = await file.arrayBuffer();
    const rec = await encryptBytes(buf);
    rec.name = file.name; rec.type = file.type; rec.size = file.size;
    if (idb) await idbOp('files', 'put', docId, rec); else (data._memFiles = data._memFiles || {})[docId] = { name: file.name, type: file.type, data: buf, plain: true };
  }
  async function getFile(docId) {
    const rec = idb ? await idbOp('files', 'get', docId) : (data._memFiles || {})[docId];
    if (!rec) return null;
    const buf = await decryptBytes(rec);
    return new Blob([buf], { type: rec.type || 'application/octet-stream' });
  }
  async function hasFile(docId) { if (!idb) return !!(data._memFiles || {})[docId]; return !!(await idbOp('files', 'get', docId)); }

  // ---------- Exportação / backup ----------
  function exportJSON() { const d = clone(data); delete d._memFiles; return JSON.stringify({ format: 'plataforma-saude', exportedAt: now(), data: d }, null, 2); }
  async function importJSON(text) {
    const o = JSON.parse(text); if (o.format !== 'plataforma-saude') throw new Error('Arquivo não reconhecido');
    data = o.data; migrate(); log('sistema', null, 'importacao_backup', null, { exportedAt: o.exportedAt }); await persist();
  }
  async function wipe() { if (idb) { await idbOp('kv', 'delete', 'meta'); await idbOp('kv', 'delete', 'payload'); } data = null; key = null; }

  // ---------- Seed → modelo ----------
  function buildFromSeed() {
    const S = window.SEED, d = { meta: { createdAt: now(), schema: 1 }, audit: [], settings: { currentPatient: S.patient.id } };
    ENTITIES.forEach(e => d[e] = []);
    const P = S.patient.id, base = () => ({ createdAt: now(), updatedAt: now(), version: 1, status: 'ativo', patientId: P });
    d.patients.push(Object.assign(base(), clone(S.patient)));
    S.documents.forEach(x => d.documents.push(Object.assign(base(), x, { review: 'extraido_conferido', importedAt: now() })));
    S.labs.forEach((x, i) => {
      const info = Catalog.info(x.code);
      d.observations.push(Object.assign(base(), { id: 'obs-l' + i, date: x.date, code: x.code, value: x.value, text: x.text, unit: info.unit, ref: x.ref, cat: info.cat, method: 'laboratorio', doc: x.doc, page: x.page, review: 'extraido_conferido' }));
    });
    S.anthropometry.forEach((x, i) => {
      const info = Catalog.info(x.code);
      d.observations.push(Object.assign(base(), { id: 'obs-a' + i, date: x.date, code: x.code, value: x.value, unit: info.unit, ref: '', cat: info.cat, method: x.method, doc: x.doc, page: x.page, review: 'extraido_conferido' }));
    });
    S.studies.forEach(x => d.studies.push(Object.assign(base(), clone(x))));
    S.segmental.forEach((x, i) => d.segmental.push(Object.assign(base(), { id: 'seg-' + i }, clone(x))));
    d.energy.push(Object.assign(base(), { id: 'en-1' }, clone(S.energy)));
    S.medications.forEach(x => d.medications.push(Object.assign(base(), clone(x), { changes: [] })));
    d.mealPlans.push(Object.assign(base(), clone(S.mealPlan), { active: true }));
    S.encounters.forEach((x, i) => d.encounters.push(Object.assign(base(), { id: 'enc-' + i }, x)));
    S.interventions.forEach((x, i) => d.interventions.push(Object.assign(base(), { id: 'int-' + i }, x)));
    S.inconsistencies.forEach(x => d.inconsistencies.push(Object.assign(base(), x)));
    S.pending.forEach((x, i) => d.pending.push(Object.assign(base(), { id: 'pen-' + i, resolved: false }, x)));
    return d;
  }

  window.Store = {
    init, unlock, createNew, createFromBackup, startMemory, setPassword, persist, cryptoOK,
    list, listAll, get, insert, update, archive, history, restoreVersion, settings,
    putFile, getFile, hasFile, exportJSON, importJSON, wipe, uid,
    get mode() { return mode; }, get encrypted() { return !!key; }, get raw() { return data; },
    onChange(f) { listeners.push(f); }
  };
})();

/* ===== core/analysis.js ===== */
/* =====================================================================
   ANÁLISE — séries, derivados, comparador, tendências, alertas,
   próximos passos e interações. Regras explícitas e auditáveis.
   Toda saída distingue: RESULTADO (dado objetivo) × HIPÓTESE × SUGESTÃO,
   e nunca é diagnóstico nem prescrição.
   ===================================================================== */
(function () {
  const { flag, info, fmtNum } = Catalog;
  const DAY = 86400000;
  const d2t = d => new Date(d + 'T12:00:00').getTime();
  const fmtDate = d => d ? d.split('-').reverse().join('/') : '—';
  const daysBetween = (a, b) => Math.round((d2t(b) - d2t(a)) / DAY);
  const todayISO = () => new Date().toISOString().slice(0, 10);
  const hash = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return (h >>> 0).toString(36); };

  // sentido "desejável" de variação (usado só quando ambos estão na faixa ou sem faixa)
  const GOOD_DOWN = ['tg', 'ldl', 'ct', 'nao_hdl', 'tg_hdl', 'apob', 'tgp', 'tgo', 'ggt', 'acido_urico', 'pcr_us', 'peso', 'imc', 'cintura', 'abdomen', 'rce',
    'gordura_pct', 'massa_gorda', 'gordura_visceral', 'gordura_subcutanea', 'glicose', 'hba1c', 'insulina', 'homa_ir', 'rdw', 'eosinofilos', 'homocisteina', 'idade_metabolica', 'fib4', 'pas', 'pad'];
  const GOOD_UP = ['hdl', 'vitd', 'ferro', 'sat_transf', 'zinco', 'massa_magra', 'massa_muscular_esq', 'massa_livre_gordura', 'indice_apendicular'];

  function ageAt(birth, date) { const b = new Date(birth), d = new Date(date || todayISO()); let a = d.getFullYear() - b.getFullYear(); if (d.getMonth() < b.getMonth() || (d.getMonth() === b.getMonth() && d.getDate() < b.getDate())) a--; return a; }

  /* Método principal de acompanhamento das medidas corporais; registros manuais entram nessa série */
  const PM = () => (Store.raw && Store.raw.settings && Store.raw.settings.primaryMethod) || 'consultorio';
  const methodOk = (o, m) => !m || o.method === m || (m === PM() && o.method === 'manual');
  function obs(pid, code, opts) {
    opts = opts || {};
    return Store.list('observations', o => o.patientId === pid && o.code === code && methodOk(o, opts.method) && (opts.includeUnconfirmed || o.review !== 'pendente_confirmacao'))
      .sort((a, b) => a.date.localeCompare(b.date));
  }

  /* Indicadores calculados — sempre marcados como derived, com fórmula e origem */
  function derived(pid) {
    const P = Store.get('patients', pid); const out = [];
    const byDate = code => { const m = {}; obs(pid, code).forEach(o => { if (o.value !== null) m[o.date] = o; }); return m; };
    const ct = byDate('ct'), hdl = byDate('hdl'), tg = byDate('tg'), vcm = byDate('vcm'), hem = byDate('hemacias'),
      tgo = byDate('tgo'), tgp = byDate('tgp'), plaq = byDate('plaquetas'), cint = byDate('cintura');
    Object.keys(ct).forEach(d => { if (hdl[d]) out.push({ code: 'nao_hdl', date: d, value: ct[d].value - hdl[d].value, unit: 'mg/dL', formula: 'CT − HDL', doc: ct[d].doc, derived: true }); });
    Object.keys(tg).forEach(d => { if (hdl[d]) out.push({ code: 'tg_hdl', date: d, value: +(tg[d].value / hdl[d].value).toFixed(2), unit: '', formula: 'TG ÷ HDL', doc: tg[d].doc, derived: true }); });
    Object.keys(vcm).forEach(d => { if (hem[d]) out.push({ code: 'mentzer', date: d, value: +(vcm[d].value / hem[d].value).toFixed(1), unit: '', formula: 'VCM ÷ hemácias (milhões/mm³)', doc: vcm[d].doc, derived: true }); });
    Object.keys(tgo).forEach(d => {
      if (tgp[d] && plaq[d] && P) {
        const age = ageAt(P.birthDate, d);
        const v = (age * tgo[d].value) / ((plaq[d].value / 1000) * Math.sqrt(tgp[d].value));
        out.push({ code: 'fib4', date: d, value: +v.toFixed(2), unit: '', formula: `Idade (${age}) × AST ÷ (plaquetas[10⁹/L] × √ALT)`, doc: tgo[d].doc, derived: true });
      }
    });
    if (P && P.height) Object.keys(cint).forEach(d => out.push({ code: 'rce', date: d, value: +(cint[d].value / (P.height * 100)).toFixed(3), unit: '', formula: 'Cintura (cm) ÷ estatura (cm)', doc: cint[d].doc, derived: true, method: cint[d].method }));
    return out;
  }
  Catalog.analytes.fib4 = { code: 'fib4', name: 'FIB-4 (calculado)', unit: '', cat: 'Hepático', derived: true };

  function seriesOf(pid, code, opts) {
    const base = obs(pid, code, opts).filter(o => o.value !== null && o.value !== undefined);
    if (base.length) return base;
    return derived(pid).filter(o => o.code === code && (!opts || methodOk(o, opts.method))).sort((a, b) => a.date.localeCompare(b.date));
  }

  function direction(code, prev, curr) {
    const fp = flag(prev.value, prev.ref), fc = flag(curr.value, curr.ref);
    if (fp && fc && fp !== 'N' && fc === 'N') return 'melhora';
    if (fp && fc && fp === 'N' && fc !== 'N') return 'piora';
    const d = curr.value - prev.value; const rel = prev.value ? Math.abs(d / prev.value) : 0;
    if (rel < 0.03) return 'estável';
    if (GOOD_DOWN.includes(code)) return d < 0 ? 'melhora' : 'piora';
    if (GOOD_UP.includes(code)) return d > 0 ? 'melhora' : 'piora';
    if (fp && fc && fp !== 'N' && fc !== 'N') { // ambos fora: aproximou-se da faixa?
      return (fc === 'H' ? d < 0 : d > 0) ? 'melhora' : 'piora';
    }
    return 'variação';
  }

  /* Comparador de exames: duas datas (ou as duas últimas) */
  function labDates(pid) {
    const c = {}; Store.list('observations', o => o.patientId === pid && o.method === 'laboratorio' && o.value !== null).forEach(o => c[o.date] = (c[o.date] || 0) + 1);
    return Object.keys(c).filter(d => c[d] >= 3).sort();
  }
  function compare(pid, dA, dB) {
    const labs = Store.list('observations', o => o.patientId === pid && o.method === 'laboratorio' && o.value !== null);
    const codes = [...new Set(labs.map(o => o.code))];
    const rows = [];
    codes.forEach(code => {
      const ser = labs.filter(o => o.code === code).sort((a, b) => a.date.localeCompare(b.date));
      // "atual" = último valor até dB; "anterior" = último antes do atual e até dA
      const curr = [...ser].reverse().find(o => o.date <= dB);
      if (!curr) return;
      const prev = [...ser].reverse().find(o => o.date < curr.date && o.date <= dA);
      const r = { code, info: info(code), curr, prev, n: ser.length, fc: flag(curr.value, curr.ref) };
      if (prev) {
        r.fp = flag(prev.value, prev.ref); r.delta = curr.value - prev.value; r.pct = prev.value ? (r.delta / prev.value) * 100 : null;
        r.rangeChanged = r.fp && r.fc && r.fp !== r.fc; r.refChanged = (prev.ref || '') !== (curr.ref || '');
        r.trend = direction(code, prev, curr);
        r.sameMonthCompare = curr.date === dB;
      }
      rows.push(r);
    });
    return rows.sort((a, b) => a.info.cat.localeCompare(b.info.cat) || a.info.name.localeCompare(b.info.name));
  }

  /* Tendência de longo prazo: regressão linear simples (por 30 dias) */
  function trend(points) {
    if (points.length < 2) return null;
    const xs = points.map(p => d2t(p.date) / DAY / 30), ys = points.map(p => p.value);
    const mx = xs.reduce((a, b) => a + b) / xs.length, my = ys.reduce((a, b) => a + b) / ys.length;
    let num = 0, den = 0; xs.forEach((x, i) => { num += (x - mx) * (ys[i] - my); den += (x - mx) ** 2; });
    return { slopePerMonth: den ? num / den : 0, first: points[0], last: points[points.length - 1], delta: ys[ys.length - 1] - ys[0], n: points.length };
  }

  function latestLabs(pid) {
    const m = {}; Store.list('observations', o => o.patientId === pid && o.method === 'laboratorio').forEach(o => { if (!m[o.code] || m[o.code].date < o.date) m[o.code] = o; });
    return m;
  }
  function abnormalStreak(pid, code) {
    const s = obs(pid, code).filter(o => o.value !== null).reverse(); let n = 0, dir = null;
    for (const o of s) { const f = flag(o.value, o.ref); if (!f || f === 'N') break; if (dir && f !== dir) break; dir = f; n++; }
    return { n, dir, total: s.length };
  }

  // ---------- Interações (base de regras simples, sempre "validar com profissional") ----------
  const INTERACTIONS = [
    { a: ['creatina'], b: ['@creatinina'], level: 'info', text: 'Suplementação de creatina pode elevar a creatinina sérica sem queda real da filtração; o próprio laudo recomenda cautela ao interpretar a TFG estimada.' },
    { a: ['ômega', 'omega'], b: ['varfarina', 'aas', 'ácido acetilsalicílico', 'clopidogrel', 'rivaroxabana', 'apixabana', 'dabigatrana', 'ticagrelor'], level: 'atenção', text: 'Ômega-3 em doses elevadas pode somar efeito antiagregante a anticoagulantes/antiagregantes.' },
    { a: ['ferro', 'sulfato ferroso'], b: ['cálcio', 'calcio', 'zinco', 'levotiroxina', 'omeprazol', 'pantoprazol', 'esomeprazol', 'café'], level: 'atenção', text: 'Absorção de ferro reduzida quando tomado junto com cálcio, zinco, IBP ou café; ferro reduz absorção de levotiroxina.' },
    { a: ['levotiroxina', 'puran', 'synthroid'], b: ['cálcio', 'calcio', 'ferro', 'café', 'omeprazol', 'colágeno', 'whey'], level: 'atenção', text: 'Levotiroxina deve ser separada de cálcio/ferro/alimentos; interação de absorção.' },
    { a: ['metformina'], b: ['@b12'], level: 'info', text: 'Uso prolongado de metformina associa-se a redução de vitamina B12 — monitorar B12.' },
    { a: ['omeprazol', 'pantoprazol', 'esomeprazol', 'lansoprazol'], b: ['@b12', '@magnesio', '@ferro'], level: 'info', text: 'IBP em uso prolongado pode reduzir absorção de B12, ferro e magnésio.' },
    { a: ['zinco'], b: ['ferro', 'cobre'], level: 'info', text: 'Zinco em dose alta compete com ferro e cobre na absorção.' },
    { a: ['semaglutida', 'tirzepatida', 'liraglutida', 'ozempic', 'mounjaro', 'wegovy', 'saxenda'], b: ['@massa_magra'], level: 'info', text: 'Agonistas de GLP-1 associam-se a perda de massa magra junto com a gordura — acompanhar composição corporal, ingestão proteica e treino de força.' },
    { a: ['alopurinol'], b: ['azatioprina', 'mercaptopurina', 'varfarina', 'amoxicilina', 'ampicilina', 'ciclofosfamida', 'didanosina'], level: 'atenção', text: 'Alopurinol interage com azatioprina/mercaptopurina (toxicidade grave), varfarina (efeito anticoagulante) e amoxicilina/ampicilina (mais reações de pele).' },
    { a: ['alopurinol'], b: ['@creatinina'], level: 'info', text: 'O alopurinol é eliminado pelos rins; a dose costuma considerar a função renal — manter creatinina/TFG monitoradas.' },
    { a: ['semaglutida', 'tirzepatida', 'liraglutida'], b: ['@acido_urico'], level: 'info', text: 'Perda de peso acelerada e mudanças alimentares podem precipitar crises de gota no início; relatar crises ao médico.' },
    { a: ['orlistate'], b: ['@vitd'], level: 'info', text: 'Orlistate reduz absorção de vitaminas lipossolúveis (A, D, E, K).' },
    { a: ['sinvastatina', 'atorvastatina', 'rosuvastatina'], b: ['genfibrozila', 'claritromicina'], level: 'atenção', text: 'Risco aumentado de miopatia com estatinas + genfibrozila/claritromicina.' },
    { a: ['hidroclorotiazida', 'clortalidona'], b: ['vitamina d', 'cálcio', 'calcio'], level: 'info', text: 'Tiazídicos + vitamina D/cálcio em dose alta: risco de hipercalcemia.' }
  ];
  function interactions(pid) {
    const meds = Store.list('medications', m => m.patientId === pid && (!m.end || m.end > todayISO()));
    const names = meds.map(m => ({ m, n: (m.name || '').toLowerCase() + ' ' + (window.Interp ? Interp.canon(m.name) : '') }));
    const labs = latestLabs(pid); const out = [];
    INTERACTIONS.forEach(rule => {
      names.filter(x => rule.a.some(k => x.n.includes(k))).forEach(x => {
        rule.b.forEach(k => {
          if (k.startsWith('@')) { const code = k.slice(1); if (labs[code] || code === 'massa_magra') out.push({ level: rule.level, items: [x.m.name, info(code).name], text: rule.text }); }
          else names.filter(y => y !== x && y.n.includes(k)).forEach(y => out.push({ level: rule.level, items: [x.m.name, y.m.name], text: rule.text }));
        });
      });
    });
    return out.filter((v, i, a) => a.findIndex(w => w.text === v.text && w.items.join() === v.items.join()) === i);
  }

  // ---------- Alertas ----------
  function alerts(pid) {
    const A = []; const P = Store.get('patients', pid); if (!P) return A;
    const latest = latestLabs(pid);
    // 1. exames fora da faixa (último resultado)
    Object.values(latest).forEach(o => {
      const f = flag(o.value, o.ref); if (!f || f === 'N') return;
      const st = abnormalStreak(pid, o.code);
      A.push({ level: st.n >= 2 ? 'atencao' : 'info', kind: 'Exame fora da referência', code: o.code,
        title: `${info(o.code).name}: ${fmtNum(o.value)} ${info(o.code).unit} (${f === 'H' ? 'acima' : 'abaixo'} da referência ${Catalog.refLabel(o.ref)})`,
        detail: st.n >= 2 ? `Alterado em ${st.n} de ${st.total} dosagens consecutivas (mais recentes).` : 'Resultado isolado — não constitui diagnóstico.',
        src: [o.doc], date: o.date });
    });
    // 2. piora entre as duas últimas dosagens (dentro ou fora da faixa)
    Object.keys(latest).forEach(code => {
      const s = obs(pid, code).filter(o => o.value !== null); if (s.length < 2) return;
      const a = s[s.length - 2], b = s[s.length - 1]; const dir = direction(code, a, b);
      const rel = a.value ? Math.abs((b.value - a.value) / a.value) : 0;
      if (dir === 'piora' && rel >= 0.10 && (GOOD_DOWN.includes(code) || GOOD_UP.includes(code) || flag(b.value, b.ref) !== 'N'))
        A.push({ level: 'info', kind: 'Piora de indicador', code, title: `${info(code).name} piorou ${fmtNum(rel * 100, 0)}% (${fmtNum(a.value)} → ${fmtNum(b.value)})`, detail: `${fmtDate(a.date)} → ${fmtDate(b.date)}`, src: [a.doc, b.doc], date: b.date });
    });
    // 3. peso não planejado / ritmo
    const peso = obs(pid, 'peso', { method: PM() });
    const hasWeightGoal = Store.list('goals', g => g.patientId === pid && (['peso', 'imc', 'gordura_pct', 'massa_gorda', 'cintura', 'abdomen'].includes(g.indicator) || /peso|gordura|composi|emagre/i.test(g.title || ''))).length > 0;
    for (let i = 1; i < peso.length; i++) {
      const a = peso[i - 1], b = peso[i], days = daysBetween(a.date, b.date), pct = (b.value - a.value) / a.value * 100;
      if (days <= 35 && Math.abs(pct) >= 5) A.push({ level: 'atencao', kind: 'Variação rápida de peso', code: 'peso', title: `Peso variou ${fmtNum(pct, 1)}% em ${days} dias`, detail: `${fmtNum(a.value)} → ${fmtNum(b.value)} kg`, src: [b.doc], date: b.date });
    }
    if (peso.length >= 2) {
      const a = peso[0], b = peso[peso.length - 1], pct = (b.value - a.value) / a.value * 100;
      if (Math.abs(pct) >= 5) A.push({ level: hasWeightGoal ? 'info' : 'atencao', kind: hasWeightGoal ? 'Evolução de peso' : 'Variação de peso sem meta registrada', code: 'peso',
        title: `Peso ${pct < 0 ? 'reduziu' : 'aumentou'} ${fmtNum(Math.abs(pct), 1)}% (${fmtNum(a.value)} → ${fmtNum(b.value)} kg) em ${Math.round(daysBetween(a.date, b.date) / 30.4)} meses`,
        detail: hasWeightGoal ? 'Compatível com objetivo registrado.' : 'Nenhum objetivo de peso está registrado — confirmar se a variação é planejada.', src: [a.doc, b.doc], date: b.date });
    }
    // 4. composição corporal: queda de massa magra no mesmo método
    ['massa_magra', 'massa_livre_gordura', 'massa_muscular_esq'].forEach(code => {
      const byMethod = {}; obs(pid, code).forEach(o => { const m = o.method === 'manual' ? PM() : o.method; (byMethod[m] = byMethod[m] || []).push(o); });
      Object.entries(byMethod).forEach(([m, s]) => {
        if (s.length < 2) return; const a = s[0], b = s[s.length - 1], d = b.value - a.value;
        if (d <= -2) {
          const pw = obs(pid, 'peso', { method: m }); const pa = pw.find(x => x.date === a.date), pb = pw.find(x => x.date === b.date);
          const share = pa && pb && (pb.value - pa.value) < 0 ? ` ≈ ${fmtNum(-d / (pa.value - pb.value) * 100, 0)}% do peso perdido no período` : '';
          A.push({ level: 'atencao', kind: 'Composição corporal', code, title: `${info(code).name} reduziu ${fmtNum(-d, 1)} kg (${Catalog.METHODS[m].short})${share}`, detail: `${fmtDate(a.date)} → ${fmtDate(b.date)}. Método sujeito a variação por hidratação/condições de medida; confirmar com medidas padronizadas.`, src: [a.doc, b.doc], date: b.date });
        }
      });
    });
    // 5. interações
    interactions(pid).forEach(x => A.push({ level: x.level === 'atenção' ? 'atencao' : 'info', kind: 'Possível interação', title: x.items.join(' × '), detail: x.text + ' Validar com profissional.', src: [], date: todayISO() }));
    // 6. ausência de acompanhamento
    const lastLab = Object.values(latest).map(o => o.date).sort().pop();
    if (lastLab && daysBetween(lastLab, todayISO()) > 120) A.push({ level: 'info', kind: 'Reavaliação', fpBasis: 'lab:' + lastLab, title: `Últimos exames laboratoriais há ${daysBetween(lastLab, todayISO())} dias (${fmtDate(lastLab)})`, detail: 'Há resultados alterados no último painel; o intervalo de repetição deve ser definido pelo médico.', src: [], date: todayISO() });
    const lastEnc = Store.list('encounters', e => e.patientId === pid).map(e => e.date).sort().pop();
    if (lastEnc && daysBetween(lastEnc, todayISO()) > 45) A.push({ level: 'info', kind: 'Ausência de acompanhamento', fpBasis: 'enc:' + lastEnc, title: `Último atendimento registrado há ${daysBetween(lastEnc, todayISO())} dias`, detail: fmtDate(lastEnc), src: [], date: todayISO() });
    // 7. metas
    Store.list('goals', g => g.patientId === pid && g.deadline && g.deadline < todayISO() && !g.achieved).forEach(g => A.push({ level: 'info', kind: 'Meta não atingida no prazo', title: g.title, detail: `Prazo: ${fmtDate(g.deadline)}`, src: [], date: g.deadline }));
    // 7b. metas fora do ritmo / medidas desatualizadas
    if (window.Interp) Interp.goals(pid).forEach(g => {
      if (g.status === 'atras') A.push({ level: 'info', kind: 'Meta atrás do ritmo', code: g.indicator, fpBasis: g.id + g.cur.date + g.cur.value, title: `${g.title}: ${info(g.indicator).name} em ${fmtNum(g.cur.value)} ${g.unit} (meta ${fmtNum(g.target)} até ${fmtDate(g.deadline)})`, detail: `Progresso ${fmtNum(Math.max(0, g.progress) * 100, 0)}% para ${fmtNum(g.expected * 100, 0)}% do prazo já decorrido.${g.neededPerMonth !== null ? ` Ritmo necessário: ${g.neededPerMonth > 0 ? '+' : ''}${fmtNum(g.neededPerMonth, 1)} ${g.unit}/mês.` : ''}`, src: [], date: g.cur.date });
      if (g.status !== 'atingida' && g.stale) A.push({ level: 'info', kind: 'Meta sem medida recente', code: g.indicator, fpBasis: g.id + g.cur.date, title: `${g.title}: última medida de ${info(g.indicator).name} em ${fmtDate(g.cur.date)}`, detail: 'Registre uma nova medida para acompanhar a meta.', src: [], date: g.cur.date });
      if (g.status === 'atingida' && g.achieved !== '1') A.push({ level: 'info', kind: 'Meta atingida', code: g.indicator, fpBasis: g.id + g.cur.date, title: `${g.title}: meta alcançada (${fmtNum(g.cur.value)} ${g.unit})`, detail: 'Confirme em Prontuário → Objetivos e defina a próxima meta.', src: [], date: g.cur.date });
    });
    // 7c. pressão arterial registrada
    const bpv = window.Interp && Interp.bp(pid);
    if (bpv && bpv.stage >= 0) A.push({ level: bpv.stage >= 3 ? 'critico' : bpv.stage >= 1 ? 'atencao' : 'info', kind: 'Pressão arterial', code: 'pas', fpBasis: 'bp' + bpv.date + bpv.sys + bpv.dia, title: `Pressão ${fmtNum(bpv.sys)}/${fmtNum(bpv.dia)} mmHg em ${fmtDate(bpv.date)} — ${bpv.label}`, detail: bpv.stage >= 1 ? 'Classificação exige medidas repetidas em dias diferentes; leve os valores ao médico.' : 'Acima do ideal; repetir as medidas.', src: [bpv.doc].filter(Boolean), date: bpv.date });
    // 7d. medicamentos aguardando exame de controle
    if (window.Interp) Interp.medEffects(pid).filter(r => r.med.start && Interp.isActive(r.med) && r.pendingControl).forEach(r => A.push({ level: 'info', kind: 'Exame de controle', fpBasis: r.med.id + r.med.start + r.items.map(i => i.after ? i.after.date : '').join(), title: `${r.med.name}: sem exame de controle após o início (${fmtDate(r.med.start)})`, detail: r.items.filter(i => !i.after).map(i => i.name).join(', ') + ` — efeito esperado: ${r.expect}. O médico define quando repetir.`, src: [], date: r.med.start }));
    // 8. dados ausentes relevantes
    if (!Store.list('observations', o => o.patientId === pid && o.code === 'pas').length) A.push({ level: 'info', kind: 'Dado ausente', title: 'Nenhuma medida de pressão arterial registrada', detail: 'Relevante para a estratificação de risco cardiometabólico.', src: [], date: todayISO() });
    if (!Store.list('consents', c => c.patientId === pid && !c.revoked).length) A.push({ level: 'info', kind: 'Privacidade', title: 'Consentimento de uso dos dados não registrado', detail: 'Registre em Configurações → Privacidade.', src: [], date: todayISO() });
    const order = { critico: 0, atencao: 1, info: 2 };
    A.forEach(a => { a.key = a.kind + '|' + (a.code || a.title.replace(/[\d.,]+/g, '#')); a.fp = hash(a.fpBasis || (a.title + '|' + (a.detail || ''))); });
    return A.sort((a, b) => order[a.level] - order[b.level] || (b.date || '').localeCompare(a.date || ''));
  }

  // ---------- Próximos passos (regras explícitas) ----------
  const L = (pid, c) => latestLabs(pid)[c];
  const val = (pid, c) => { const o = L(pid, c); return o ? o.value : null; };
  const isF = (pid, c, f) => { const o = L(pid, c); return o && flag(o.value, o.ref) === f; };
  const lastN = (pid, c, n) => obs(pid, c).filter(o => o.value !== null).slice(-n);
  const ser = (pid, c, m) => obs(pid, c, m ? { method: m } : null).filter(o => o.value !== null).map(o => `${fmtNum(o.value)} (${fmtDate(o.date).slice(3)})`).join(' → ');
  const docs = (pid, codes) => [...new Set(codes.flatMap(c => obs(pid, c).map(o => o.doc)))];

  const hasDx = (pid, re) => { const C = (Store.get('patients', pid) || {}).clinical || {}; return (C.diagnoses || []).some(d => d.status !== 'descartado' && re.test(d.text)) || [].concat(C.metabolic || []).some(x => re.test(x)); };
  const medOn = (pid, re) => Interp.meds(pid).some(m => re.test(m.canon) || re.test(m.name));
  const yr = d => d ? d.slice(0, 4) : '';
  const lastOf = (pid, c, m) => obs(pid, c, m ? { method: m } : null).filter(o => o.value !== null).pop();
  const fl = (pid, c) => { const o = L(pid, c); return o ? flag(o.value, o.ref) : null; };
  const listJoin = a => a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' e ' + a[a.length - 1];
  const effText = (pid, c, code) => { const e = Interp.effectFor(pid, c, code); return e && e.item ? e.item.text : ''; };

  /* Cada regra: p (prioridade), ptitle/plain (linguagem simples) e os campos técnicos da explicação detalhada.
     Os textos são montados a partir dos dados atuais — qualquer alteração manual muda a interpretação. */
  const RULES = [
    { p: 1, id: 'critico', when: pid => criticalValues(pid).length > 0, build: pid => ({
      ptitle: 'Exame com valor que pede contato rápido com o médico', plain: 'Algum resultado está numa faixa que costuma exigir avaliação médica em poucos dias: ' + criticalValues(pid).map(x => x.text).join('; ') + '.',
      title: 'Valores laboratoriais em faixa potencialmente crítica', found: criticalValues(pid).map(x => x.text).join('; '), data: 'Último resultado de cada analito',
      why: 'Valores nessa faixa podem exigir avaliação médica em prazo curto.', who: 'Médico assistente', next: 'Contato com o médico para avaliação.', when: 'Imediato / dias', monitor: 'Analitos citados', evidence: 'A', src: [] }) },
    { p: 1, id: 'pa_alta', when: pid => { const b = Interp.bp(pid); return b && b.stage >= 3; }, build: pid => { const b = Interp.bp(pid); return {
      ptitle: 'Pressão arterial muito alta', plain: `A última pressão registrada foi ${fmtNum(b.sys)}/${fmtNum(b.dia)} mmHg (${fmtDate(b.date)}). Valores a partir de 180/110 pedem avaliação médica rápida, principalmente se houver dor de cabeça forte, dor no peito, falta de ar ou alteração na visão.`,
      title: 'Pressão arterial em faixa de estágio 3', found: `PA ${b.series}.`, data: 'Medidas registradas', why: 'Diretriz Brasileira de Hipertensão 2020: ≥ 180/110 mmHg = estágio 3.', who: 'Médico (com urgência se houver sintomas)', next: 'Procurar avaliação médica; com sintomas, atendimento de urgência.', when: 'Imediato', monitor: 'Pressão arterial', evidence: 'A', src: [b.doc].filter(Boolean) }; } },
    { p: 2, id: 'pa', when: pid => { const b = Interp.bp(pid); return b && b.stage >= 1 && b.stage < 3; }, build: pid => { const b = Interp.bp(pid); const anti = medOn(pid, /anti-hipertensivo/); return {
      ptitle: 'Pressão arterial acima do normal', plain: `A última pressão registrada foi ${fmtNum(b.sys)}/${fmtNum(b.dia)} mmHg (${fmtDate(b.date)}), na faixa de ${b.label.toLowerCase()}. O diagnóstico de hipertensão exige medidas repetidas em dias diferentes${anti ? '; você já usa remédio para pressão, então o médico avalia se o controle está adequado' : ''}.`,
      title: b.label, found: `PA ${b.series}; ${b.n} medida(s) nos últimos 90 dias.`, data: 'Pressão registrada manualmente', why: 'Diretriz Brasileira de Hipertensão 2020: ≥ 140/90 mmHg em consultório caracteriza hipertensão quando confirmado. Obesidade, gota e apneia do sono se associam a pressão alta; a perda de peso costuma reduzir a pressão.',
      who: 'Médico (clínico / cardiologista)', next: 'Medir a pressão em casa por 7 dias (manhã e noite, sentado, após 5 min de repouso) ou fazer MAPA, e levar os valores ao médico.', when: '2–4 semanas', monitor: 'Pressão arterial', evidence: 'A', src: [b.doc].filter(Boolean) }; } },
    { p: 3, id: 'pa_pre', when: pid => { const b = Interp.bp(pid); return b && b.stage === 0; }, build: pid => { const b = Interp.bp(pid); return {
      ptitle: 'Pressão um pouco acima do ideal', plain: `A última pressão foi ${fmtNum(b.sys)}/${fmtNum(b.dia)} mmHg — faixa de pré-hipertensão. Perda de peso, menos sal, menos álcool e atividade física ajudam a baixar.`,
      title: 'Pré-hipertensão', found: `PA ${b.series}.`, data: 'Pressão registrada', why: 'Diretriz Brasileira de Hipertensão 2020: 130–139/85–89 mmHg.', who: 'Médico', next: 'Repetir medidas periodicamente.', when: '3–6 meses', monitor: 'Pressão arterial', evidence: 'A', src: [] }; } },
    { p: 2, id: 'gota', when: pid => { if (!hasDx(pid, /gota/i)) return false; const v = val(pid, 'acido_urico'); const g = Interp.goalFor(pid, 'acido_urico'); return v !== null && v >= (g ? g.target : 6); }, build: pid => {
      const v = val(pid, 'acido_urico'), lo = L(pid, 'acido_urico'); const g = Interp.goalFor(pid, 'acido_urico'); const tgt = g ? g.target : 6;
      const alo = Interp.meds(pid).find(m => ['alopurinol', 'febuxostate'].includes(m.canon)); const eff = alo ? Interp.effectFor(pid, alo.canon, 'acido_urico') : null;
      let medTxt = !alo ? 'Nenhum remédio para baixar o ácido úrico está registrado.' : !alo.start ? `Você usa ${alo.name} ${alo.dose}, mas sem data de início registrada não dá para saber se este exame já reflete o tratamento.`
        : lo.date < alo.start ? `O exame (${fmtDate(lo.date)}) foi colhido ANTES de começar o ${alo.name} (${fmtDate(alo.start)}) — ainda não mostra o efeito do remédio. Um novo exame é que vai dizer se a meta foi atingida.`
        : A_days(alo.start, lo.date) < 28 ? `O exame foi colhido só ${A_days(alo.start, lo.date)} dias após o início do ${alo.name}; o efeito completo leva algumas semanas.` : `O exame já foi colhido em uso de ${alo.name} ${alo.dose} há mais de 4 semanas, e ainda está acima da meta.`;
      return { ptitle: lo.date < (alo && alo.start || '0') ? 'Ácido úrico: aguardar exame após o início do alopurinol' : 'Ácido úrico ainda acima da meta para quem trata gota',
        plain: `O último ácido úrico foi ${fmtNum(v)} mg/dL. Para quem trata gota, a meta ${g ? 'que você registrou' : 'usual'} é ficar abaixo de ${fmtNum(tgt)}. ${medTxt}`,
        title: 'Ácido úrico acima do alvo terapêutico da gota', found: `Ácido úrico ${ser(pid, 'acido_urico')} mg/dL. ${alo ? `${alo.name} ${alo.dose} ${alo.freq}${alo.start ? ', início ' + fmtDate(alo.start) : ' (início não informado)'}.` : ''} ${eff && eff.item ? 'Efeito: ' + eff.item.text : ''}`,
        data: 'Bioquímica + diagnóstico de gota + medicamentos registrados', why: `Diretrizes de reumatologia e a nota do laudo recomendam ácido úrico < 6 mg/dL em quem trata gota (< 5 com tofos).${Interp.has(pid, 'alcohol', /4 ou mais|excesso|cerveja/) ? ' O consumo de álcool registrado (especialmente cerveja) eleva o ácido úrico.' : ''}`,
        who: 'Médico (clínico / reumatologista)', next: alo && alo.start && lo.date < alo.start ? 'Pedir ao médico um novo ácido úrico (e creatinina) após 4–6 semanas de tratamento.' : 'Levar a série ao médico; ele decide se mantém ou ajusta o tratamento. Não alterar a dose por conta própria.', when: 'Próxima consulta médica', monitor: 'Ácido úrico, creatinina, crises articulares', evidence: 'A', limit: 'Perda de peso rápida e mudanças na dieta podem desencadear crises no início do tratamento.', src: docs(pid, ['acido_urico']) };
    } },

    if (series.length > 1) { const lg = document.createElement('div'); lg.className = 'legend'; lg.innerHTML = series.map((s, si) => `<span><span class="sw" style="background:${s.color || PALETTE[si % PALETTE.length]}"></span>${esc(s.name)}</span>`).join(''); el.insertBefore(lg, el.firstChild); }
  }

  /* barras horizontais simples (ex.: segmentos corporais, macros) */
  function hbars(el, rows, unit) {
    const max = Math.max(...rows.map(r => r.value), 1);
    el.innerHTML = rows.map((r, i) => `<div class="hbar"><span class="hbar-l">${esc(r.label)}</span><span class="hbar-t"><span style="width:${r.value / max * 100}%;background:${r.color || PALETTE[0]}"></span></span><span class="hbar-v">${r.value.toLocaleString('pt-BR', { maximumFractionDigits: 1 })} ${unit || ''}</span></div>`).join('');
  }
  function spark(values, w, h) {
    w = w || 90; h = h || 26; if (values.length < 2) return '';
    const mn = Math.min(...values), mx = Math.max(...values), X = i => 2 + i / (values.length - 1) * (w - 4), Y = v => h - 3 - (mx === mn ? 0.5 : (v - mn) / (mx - mn)) * (h - 6);
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${values.map((v, i) => X(i) + ',' + Y(v)).join(' ')}" fill="none" stroke="${PALETTE[0]}" stroke-width="2" stroke-linecap="round"/><circle cx="${X(values.length - 1)}" cy="${Y(values[values.length - 1])}" r="3" fill="${PALETTE[0]}"/></svg>`;
  }
  window.Charts = { line, hbars, spark, PALETTE };
})();

    on('#gwipe', async () => { if (prompt('Isto apaga TODOS os arquivos do sistema no seu Drive (backup, versões, cópias e anexos). Os dados deste aparelho continuam. Digite APAGAR para confirmar.') !== 'APAGAR') return; try { if (!Sync.hasToken()) await Sync.authorize(); await Sync.wipeCloud(); App.toast('Dados apagados do Drive'); App.render(); } catch (e) { alert(e.message); } });
    on('#gvers', async () => {
      try { if (!Sync.hasToken()) await Sync.authorize(); if (!(await Sync.loadKey())) return alert('Sincronize primeiro para informar a senha da nuvem.');
        const [revs, copies] = await Promise.all([Sync.listVersions(), Sync.listCopies()]);
        App.modal(`<h2>Versões no Google Drive</h2><h3>Backup principal (versões recentes guardadas pelo Drive)</h3>${revs.map(r => `<div class="dash-item"><span>${dt(r.modifiedTime)} <span class="small muted">${Math.round((+r.size || 0) / 1024)} KB</span></span><span class="sp"></span><button class="btn sm" data-rv="${r.id}">Restaurar</button></div>`).join('') || '<p class="muted small">Nenhuma.</p>'}
          <h3>Cópias de segurança (antes de conflitos)</h3>${copies.map(f => `<div class="dash-item"><span>${dt((f.appProperties || {}).savedAt || f.modifiedTime)} · ${esc((f.appProperties || {}).device || '')} <span class="small muted">${esc((f.appProperties || {}).label || '')}</span></span><span class="sp"></span><button class="btn sm" data-cp="${f.id}">Restaurar</button></div>`).join('') || '<p class="muted small">Nenhuma.</p>'}
          <p class="small muted">Restaurar substitui os dados deste aparelho; depois, use “Sincronizar” para enviar ao Drive.</p><div class="row"><span class="sp"></span><button class="btn" data-close>Fechar</button></div>`, (m, close) => {
          $$('[data-rv]', m).forEach(b => b.onclick = async () => { if (!confirm('Substituir os dados deste aparelho por esta versão?')) return; try { await Sync.restoreRevision(b.dataset.rv); close(); App.render(); App.toast('Versão restaurada — sincronize para enviar ao Drive'); } catch (e) { alert(e.message); } });
          $$('[data-cp]', m).forEach(b => b.onclick = async () => { if (!confirm('Substituir os dados deste aparelho por esta cópia?')) return; try { await Sync.restoreCopy(b.dataset.cp); close(); App.render(); App.toast('Cópia restaurada — sincronize para enviar ao Drive'); } catch (e) { alert(e.message); } });
        }); } catch (e) { alert(e.message); }
    });
  };

  /* primeira abertura num aparelho novo: restaurar do Drive ou de um arquivo de backup */
  App.firstRunRestoreHTML = () => `<div class="card" style="margin-top:12px;padding:12px"><b>Já usa o sistema em outro aparelho?</b>
    <p class="small muted">Restaure os dados do Google Drive ou de um arquivo de backup (.json). ${Sync.httpsOk() ? '' : 'A restauração pelo Drive só funciona com o sistema aberto pelo endereço https.'}</p>
    <label class="small">Client ID do Google<input id="frcid" value="${esc(Sync.clientId())}" placeholder="…apps.googleusercontent.com" style="width:100%"></label>
    <label class="small">Senha deste aparelho (opcional — protege a base local)<input type="password" id="frlp" autocomplete="new-password" style="width:100%"></label>
    <div class="row" style="margin-top:8px;flex-wrap:wrap;gap:6px"><button class="btn pri" id="frdrive" ${Sync.httpsOk() ? '' : 'disabled'}>☁ Restaurar do Google Drive</button><label class="btn">📄 Importar backup (.json)<input type="file" accept=".json,application/json" id="frjson" hidden></label></div><div class="small" id="frerr" style="color:var(--crit)"></div></div>`;
  App.bindFirstRun = root => {
    const err = t => { $('#frerr', root).textContent = t; };
    const lp = () => { const p = $('#frlp', root).value; if (p && p.length < 6) throw new Error('Senha deste aparelho: mínimo de 6 caracteres.'); return p || null; };
    $('#frdrive', root).onclick = async () => {
      try { const cid = $('#frcid', root).value.trim(); if (cid) Sync.setCfg({ clientId: cid }); const localPw = lp();
        await Sync.authorize(true);
        const pw = await askPassword(true); if (!pw) return; err('Baixando e abrindo o backup…');
        const r = await Sync.fetchMain(pw.password, pw.remember);
        Sync.suppress = true; try { await Store.createFromBackup(r.text, localPw); } finally { Sync.suppress = false; }
        const n = await r.finish(); App.render(); await new Promise(z => setTimeout(z, 700)); Sync.markClean(); App.toast(`Dados restaurados do Drive${r.meta && r.meta.device ? ' (salvos em ' + r.meta.device + ')' : ''}${n ? ' · ' + n + ' anexo(s)' : ''}`);
      } catch (e) { err(e.message); }
    };
    $('#frjson', root).onchange = async e => { try { const f = e.target.files[0]; if (!f) return; const localPw = lp(); await Store.createFromBackup(await f.text(), localPw); App.render(); App.toast('Backup importado. Para usar em vários aparelhos: Configurações → Google Drive.'); } catch (x) { err(x.message); } };
  };

  /* ao iniciar: liga o monitor de alterações e pré-carrega o login do Google para o clique abrir a janela sem bloqueio */
  App.initSync = () => {
    Store.onChange(() => Sync.onLocalChange());
    if (Sync.connected) { Sync.state.status = 'auth'; Sync.state.msg = 'Clique para sincronizar com o Drive'; }
    if (Sync.httpsOk() && (Sync.connected || Sync.clientId())) { const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true; document.head.appendChild(s); }
  };
})();

App.boot();</script></body></html>
